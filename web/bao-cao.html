<body>

      <button data-tab="tai-chinh">Tài chính</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js?v=8"></script>
<script src="assets/app.js?v=8"></script>
<script src="assets/du-lieu.js?v=8"></script>
<script>
const { sb, C, esc, $, $$, toast, vnToday, themNgay, themThang, dauThang, soNgay,
        ngayTrongThang, ddmm, ddmmyy, nhanThang, tien, phanTram,
        TRANG_THAI, KENH, COC, LOAI_TIEN, laOTA, conThu, xuatExcel, serial, DINH_DANG } = Mo;

let me, D = { props: [], units: [], bookings: [] }, payments = [], chiPhi = [], thuKhac = [], tab = "luot";

$("#veHub").href = C.HUB_URL;

const lonHon = (a, b) => (a > b ? a : b);
const nhoHon = (a, b) => (a < b ? a : b);
// Số đêm giao nhau giữa [aS,aE) và [bS,bE)
const giaoDem = (aS, aE, bS, bE) => Math.max(0, soNgay(lonHon(aS, bS), nhoHon(aE, bE)));

Mo.khoiDong("xem", async (nguoi) => {
  me = nguoi;
  $("#fKenh").innerHTML = `<option value="">Mọi kênh</option>` +
    Object.entries(KENH).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  $("#fTrangThai").innerHTML = `<option value="">Mọi trạng thái</option>` +
    Object.entries(TRANG_THAI).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");

  $$("#tabs button").forEach((b) => (b.onclick = () => {
    $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
    tab = b.dataset.tab; location.hash = tab; Mo.luuLoc("bao-cao-tab", { tab }); ve();
  }));
  $("#xuat").onclick = xuatFileExcel;

  const tabCu = location.hash.slice(1) || Mo.docLoc("bao-cao-tab").tab;
  if (["luot", "thang", "loi-nhuan", "tai-chinh"].includes(tabCu)) {
    tab = tabCu;
    $$("#tabs button").forEach((x) => x.classList.toggle("on", x.dataset.tab === tab));
  }

  await nap();
  // Bộ lọc mặc định là THÁNG ĐANG CHẠY, và nhớ lại lựa chọn của lần mở trước.
  // Gắn sau khi nạp xong để danh sách nhà/căn đã có sẵn lựa chọn cũ.
  Mo.noiLoc("bao-cao",
    { tu: $("#fTu"), den: $("#fDen"), nha: $("#fNha"), can: $("#fCan"),
      kenh: $("#fKenh"), trangThai: $("#fTrangThai") },
    { tu: Mo.dauThangNay(), den: Mo.sauThangNay(), nha: "", can: "", kenh: "", trangThai: "" },
    () => { dongBoCan(); ve(); });
  dongBoCan(); ve();
});

async function nap() {
  D = await Mo.taiDuLieu(me);
  const [rp, rc, rt] = await Promise.all([
    sb.from("payments").select("*"),
    sb.from("expenses").select("*").is("deleted_at", null),
    sb.from("other_income").select("*").is("deleted_at", null),
  ]);
  payments = rp.data ?? []; chiPhi = rc.data ?? []; thuKhac = rt.data ?? [];
  $("#fNha").innerHTML = `<option value="">Tất cả nhà</option>` +
    D.props.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  dongBoCan();
  ve();
}

function dongBoCan() {
  const nha = $("#fNha").value, dangChon = $("#fCan").value;
  const ds = D.units.filter((u) => !nha || u.property_id === nha);
  $("#fCan").innerHTML = `<option value="">Tất cả căn</option>` +
    ds.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join("");
  $("#fCan").value = ds.some((u) => u.id === dangChon) ? dangChon : "";
}

// ---------- Bộ lọc ----------
function boLoc() {
  return {
    tu: $("#fTu").value || "1900-01-01",
    den: $("#fDen").value || "2999-01-01",
    nha: $("#fNha").value, can: $("#fCan").value,
    kenh: $("#fKenh").value, trangThai: $("#fTrangThai").value,
  };
}
function canTrongLoc(f) {
  return D.units.filter((u) => (!f.nha || u.property_id === f.nha) && (!f.can || u.id === f.can));
}
function bookingTrongLoc(f) {
  const idCan = new Set(canTrongLoc(f).map((u) => u.id));
  return D.bookings.filter((b) => idCan.has(b.unit_id)
    && (f.trangThai ? b.status === f.trangThai : b.status !== "huy")
    && (!f.kenh || b.channel === f.kenh)
    && b.start_date < f.den && b.end_date > f.tu);
}
// Tình trạng thanh toán của một lượt — luôn gọi qua đây để mọi bảng ra cùng số
const ttCuaBooking = (b) => Mo.tinhThanhToan(b,
  payments.filter((x) => x.booking_id === b.id),
  thuKhac.filter((x) => x.booking_id === b.id));

const tenCan = (id) => {
  const u = D.units.find((x) => x.id === id);
  return u ? Mo.tenCan(u, D.props) : "—";
};

function ve() {
  const f = boLoc();
  $("#nhanhKy").textContent = `Khoảng lọc: ${ddmmyy(f.tu)} → ${ddmmyy(f.den)}`;
  if (tab === "luot") veLuot(f);
  else if (tab === "thang") veThang(f);
  else if (tab === "loi-nhuan") veLoiNhuan(f);
  else veTaiChinh(f);
}

function bang(tieuDe, hang, opts = {}) {
  return `<div class="bang-khung"><table class="bang">
    <thead><tr>${tieuDe.map((t, i) => `<th class="${opts.so?.includes(i) ? "so" : ""}">${esc(t)}</th>`).join("")}</tr></thead>
    <tbody>${hang.map((h) => `<tr class="${h.lop ?? ""}">${h.o.map((v, i) =>
      `<td class="${opts.so?.includes(i) ? "so" : ""}">${h.raw?.[i] ?? esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}




// ================= CHI PHÍ & LỢI NHUẬN =================
// Mô tự vận hành từ 22/09/2026 nên sổ này KHÔNG chia doanh thu với đơn vị vận hành.
//   Lợi nhuận = doanh thu phòng − hoa hồng môi giới + thu khác − chi phí
const TEN_NHOM_KENH = { airbnb: "Airbnb", booking: "Booking.com", agoda: "Agoda",
  le: "Khách trực tiếp lẻ", thang: "Khách theo tháng", moi_gioi: "Môi giới", khac: "Khác" };
// Sheet cũ tách "khách trực tiếp lẻ" và "khách theo tháng"; trong hệ thống đó là
// cùng kênh trực tiếp, khác nhau ở kiểu thuê.
const nhomKenh = (b) => b.channel === "truc_tiep"
  ? (b.term_type === "dai_han" ? "thang" : "le")
  : (b.channel || "khac");

const cachTinh = () => cach0;

// Gọi `gom(thang, tien)` cho từng phần doanh thu của một lượt thuê
function raiDoanhThu(b, cach, gom) {
  const tong = b.rent_amount ?? 0;
  if (cach === "nhan") return gom(dauThang(b.start_date), tong);
  if (cach === "tra") return gom(dauThang(b.end_date), tong);
  // phân bổ theo đêm: dài hạn lấy giá tháng chia số ngày của tháng,
  // ngắn hạn lấy tổng tiền chia tổng số đêm
  const tongDem = soNgay(b.start_date, b.end_date);
  for (let m = dauThang(b.start_date); m < b.end_date; m = themThang(m, 1)) {
    const d = giaoDem(b.start_date, b.end_date, m, themThang(m, 1));
    if (!d) continue;
    const ngay = ngayTrongThang(m);
    gom(m, (b.term_type === "dai_han" ? tong / ngay : tong / (tongDem || 1)) * d);
  }
}

// Trả về { thang: {phong, hoaHong, thuKhac, chi, kenh:{}, can:{}, loaiChi:{}} }
function gopTheoThang(f) {
  const cach = cachTinh();
  const ds = bookingTrongLoc(f);
  const idNha = new Set(canTrongLoc(f).map((u) => u.property_id));
  const o = {};
  const lay = (m) => (o[m] = o[m] || { phong: 0, hoaHong: 0, thuKhac: 0, chi: 0, kenh: {}, can: {}, loaiChi: {} });
  // Liệt kê đủ mọi tháng trong khoảng lọc, kể cả tháng chưa có đồng nào —
  // báo cáo lãi lỗ mà nhảy cóc qua tháng trống thì rất khó đối chiếu.
  for (let m = dauThang(f.tu); m < f.den; m = themThang(m, 1)) lay(m);

  ds.forEach((b) => {
    const k = nhomKenh(b), ten = tenCan(b.unit_id);
    raiDoanhThu(b, cach, (m, v) => {
      if (m < dauThang(f.tu) || m >= f.den) return;
      const g = lay(m);
      g.phong += v; g.kenh[k] = (g.kenh[k] ?? 0) + v; g.can[ten] = (g.can[ten] ?? 0) + v;
    });
    if (b.commission_amount) {
      const m = dauThang(cach === "nhan" ? b.start_date : b.end_date);
      if (m >= dauThang(f.tu) && m < f.den) lay(m).hoaHong += b.commission_amount;
    }
  });

  // Chi phí và thu khác: lọc theo nhà nếu người dùng đã chọn nhà/căn.
  // Dòng "chung" (không gắn nhà) chỉ tính khi đang xem tất cả nhà.
  const hopNha = (pid) => (f.nha || f.can) ? idNha.has(pid) : true;
  thuKhac.forEach((x) => {
    const m = dauThang(x.received_on);
    if (m < dauThang(f.tu) || m >= f.den || !hopNha(x.property_id)) return;
    lay(m).thuKhac += x.amount ?? 0;
  });
  chiPhi.forEach((x) => {
    const m = dauThang(x.spent_on);
    if (m < dauThang(f.tu) || m >= f.den || !hopNha(x.property_id)) return;
    const g = lay(m);
    g.chi += x.amount ?? 0;
    g.loaiChi[x.category] = (g.loaiChi[x.category] ?? 0) + (x.amount ?? 0);
  });
  return o;
}

const loiNhuan = (g) => g.phong - g.hoaHong + g.thuKhac - g.chi;

function veLoiNhuan(f) {
  const o = gopTheoThang(f);
  const thangs = Object.keys(o).sort();
  const T = { phong: 0, hoaHong: 0, thuKhac: 0, chi: 0 };
  thangs.forEach((m) => { T.phong += o[m].phong; T.hoaHong += o[m].hoaHong;
    T.thuKhac += o[m].thuKhac; T.chi += o[m].chi; });
  const tongLoi = T.phong - T.hoaHong + T.thuKhac - T.chi;

  const bangPhu = (tieuDe, khoa, nhan) => {
    const cot = [...new Set(thangs.flatMap((m) => Object.keys(o[m][khoa])))];
    if (!cot.length) return "";
    const hang = cot.map((c) => ({ o: [nhan ? (nhan[c] ?? c) : c,
      ...thangs.map((m) => tien(o[m][khoa][c] ?? 0)),
      tien(thangs.reduce((s, m) => s + (o[m][khoa][c] ?? 0), 0))] }));
    const so = thangs.map((_, i) => i + 1).concat([thangs.length + 1]);
    return `<h2>${tieuDe}</h2>` +
      bang(["", ...thangs.map((m) => nhanThang(m)), "Tổng"], hang, { so });
  };

  const hangChinh = thangs.map((m) => {
    const g = o[m];
    return { o: [nhanThang(m), tien(g.phong), tien(g.hoaHong), tien(g.thuKhac),
      tien(g.chi), tien(loiNhuan(g))],
      lop: loiNhuan(g) < 0 ? "tre" : "" };
  });
  if (thangs.length) hangChinh.push({ lop: "tong", o: ["TỔNG", tien(T.phong), tien(T.hoaHong),
    tien(T.thuKhac), tien(T.chi), tien(tongLoi)] });

  $("#than").innerHTML = `
    <div class="cong-cu">
      <label for="fCachTinh" style="margin:0 6px 0 0">Tính doanh thu theo</label>
      <select id="fCachTinh" style="flex:0 0 210px">
        <option value="tra">Tháng khách trả phòng</option>
        <option value="nhan">Tháng khách nhận phòng</option>
        <option value="dem">Phân bổ đều theo đêm</option>
      </select>
    </div>
    <div class="the-luoi">
      <div class="the"><span class="so">${tien(T.phong)}</span><span class="nhan">doanh thu phòng</span></div>
      <div class="the"><span class="so">${tien(T.thuKhac)}</span><span class="nhan">thu khác (điện nước, dịch vụ)</span></div>
      <div class="the"><span class="so">${tien(T.chi + T.hoaHong)}</span><span class="nhan">chi phí + hoa hồng</span></div>
      <div class="the ${tongLoi < 0 ? "nhac" : ""}"><span class="so">${tien(tongLoi)}</span><span class="nhan">lợi nhuận</span></div>
    </div>
    ${thangs.length ? `<h2>Theo tháng</h2>` + bang(
        ["Tháng", "Doanh thu phòng", "Hoa hồng", "Thu khác", "Chi phí", "Lợi nhuận"],
        hangChinh, { so: [1, 2, 3, 4, 5] })
      : `<p class="trong">Không có số liệu trong khoảng lọc.</p>`}
    ${bangPhu("Doanh thu theo kênh", "kenh", TEN_NHOM_KENH)}
    ${bangPhu("Doanh thu theo căn", "can", null)}
    ${bangPhu("Chi phí theo phân loại", "loaiChi", Mo.PHAN_LOAI_CHI)}
    <p class="muted">Lợi nhuận = doanh thu phòng − hoa hồng môi giới + thu khác − chi phí.
      Ghi chi phí và thu khác ở trang <a href="thu-chi.html">Thu &amp; chi</a>.
      ${(f.nha || f.can) ? "Đang lọc theo nhà nên các khoản chi ghi <b>chung cho cả hệ thống</b> không được tính vào đây." : ""}</p>`;

  $("#fCachTinh").value = cach0;
  $("#fCachTinh").onchange = () => { cach0 = $("#fCachTinh").value; Mo.luuLoc("bao-cao-cach", { cach: cach0 }); ve(); };
}
let cach0 = Mo.docLoc("bao-cao-cach").cach || "tra";

// ================= XUẤT EXCEL =================
// Ba sheet số liệu + một sheet giải thích. Các ô dẫn xuất đều là CÔNG THỨC thật
// (SUM, chia, MAX…) nên sửa một số trong Excel là cả bảng tự tính lại.
const oTien = (n) => ({ v: Math.round(n || 0), z: DINH_DANG.tien });
const oNgay = (iso) => ({ v: serial(iso), z: DINH_DANG.ngay });
// Ô công thức: f là công thức Excel, v là giá trị đã tính sẵn (bắt buộc), z là định dạng
const ct = (f, v, z) => ({ f, v, z });
const cotChu = (i) => String.fromCharCode(65 + i);
const chia = (a, b) => (b ? a / b : 0);

function sheetLuot(f) {
  const ds = bookingTrongLoc(f).slice().sort((a, b) => a.start_date.localeCompare(b.start_date));
  const hang = [["Căn", "Khách", "Ngày vào", "Ngày trả", "Số đêm", "Kiểu thuê", "Kênh",
                 "Môi giới", "Hoa hồng", "Tiền phòng", "Dịch vụ thêm", "Tổng phải thu",
                 "Đã thu", "Còn phải thu", "Tình trạng thanh toán", "Trạng thái"]];
  const t = { dem: 0, hoaHong: 0, phong: 0, dvu: 0, phaiThu: 0, daThu: 0, conThu: 0 };
  ds.forEach((b, i) => {
    const r = i + 2;                                   // dòng 1 là tiêu đề
    const tt = Mo.tinhThanhToan(b, payments.filter((x) => x.booking_id === b.id),
                                   thuKhac.filter((x) => x.booking_id === b.id));
    const dem = soNgay(b.start_date, b.end_date);
    t.dem += dem; t.hoaHong += b.commission_amount ?? 0; t.phong += b.rent_amount ?? 0;
    t.dvu += tt.tienDvu; t.phaiThu += tt.tongPhaiThu; t.daThu += tt.daThu; t.conThu += tt.conPhaiThu;
    hang.push([
      tenCan(b.unit_id), b.guest_name || "(chưa ghi tên)",
      oNgay(b.start_date), oNgay(b.end_date),
      ct("D" + r + "-C" + r, dem, DINH_DANG.so),       // số đêm = ngày trả − ngày vào
      b.term_type === "dai_han" ? "Dài hạn" : "Ngắn hạn",
      KENH[b.channel] ?? "—", b.broker_name ?? "",
      oTien(b.commission_amount), oTien(b.rent_amount), oTien(tt.tienDvu),
      ct("J" + r + "+K" + r, tt.tongPhaiThu, DINH_DANG.tien),
      oTien(tt.daThu),
      ct("MAX(0,L" + r + "-M" + r + ")", tt.conPhaiThu, DINH_DANG.tien),
      Mo.nhanThanhToan(tt).chu,
      TRANG_THAI[b.status] ?? b.status,
    ]);
  });
  if (ds.length) {
    const c = ds.length + 1;
    const sum = (col, giaTri) => ct("SUM(" + col + "2:" + col + c + ")", giaTri, DINH_DANG.tien);
    const rTong = c + 1;
    hang.push(["TỔNG", "", "", "",
      ct("SUM(E2:E" + c + ")", t.dem, DINH_DANG.so), "", "", "",
      sum("I", t.hoaHong), sum("J", t.phong), sum("K", t.dvu), sum("L", t.phaiThu),
      sum("M", t.daThu), sum("N", t.conThu), "", ""]);
    hang.push([]);
    hang.push(["Số lượt", ct("COUNTA(A2:A" + c + ")", ds.length, DINH_DANG.so)]);
    hang.push(["Độ dài lưu trú trung bình (đêm)",
      ct("IFERROR(E" + rTong + "/COUNTA(A2:A" + c + "),0)", chia(t.dem, ds.length), "0.0")]);
  }
  return { ten: "Theo lượt khách",
    cot: [26, 20, 12, 12, 8, 10, 13, 14, 14, 15, 14, 16, 14, 15, 26, 14], hang };
}

function sheetThang(f) {
  const can = canTrongLoc(f), ds = bookingTrongLoc(f);
  const hang = [["Tháng", "Căn", "Đêm khả dụng", "Đêm đã bán", "Tỷ lệ lấp đầy",
                 "Doanh thu ghi nhận", "ADR", "RevPAR", "Thực thu"]];
  const t = { khaDung: 0, demBan: 0, doanhThu: 0, thucThu: 0 };
  for (let m = dauThang(f.tu); m < f.den; m = themThang(m, 1)) {
    const mEnd = themThang(m, 1), ngay = ngayTrongThang(m);
    for (const u of can) {
      let demBan = 0, doanhThu = 0;
      for (const b of ds.filter((x) => x.unit_id === u.id)) {
        const d = giaoDem(b.start_date, b.end_date, m, mEnd);
        if (!d) continue;
        demBan += d;
        const tongDem = soNgay(b.start_date, b.end_date);
        doanhThu += (b.term_type === "dai_han"
          ? (b.rent_amount ?? 0) / ngay
          : (b.rent_amount ?? 0) / (tongDem || 1)) * d;
      }
      if (!demBan) continue;
      const idB = new Set(ds.filter((x) => x.unit_id === u.id).map((x) => x.id));
      const thucThu = payments.filter((x) => idB.has(x.booking_id) && x.paid_date
        && x.paid_date >= m && x.paid_date < mEnd).reduce((s, x) => s + (x.amount_paid ?? 0), 0);
      t.khaDung += ngay; t.demBan += demBan; t.doanhThu += doanhThu; t.thucThu += thucThu;
      const r = hang.length + 1;
      hang.push([nhanThang(m), Mo.tenCan(u, D.props), ngay, demBan,
        ct("IFERROR(D" + r + "/C" + r + ",0)", chia(demBan, ngay), DINH_DANG.phanTram),
        oTien(doanhThu),
        ct("IFERROR(F" + r + "/D" + r + ",0)", chia(doanhThu, demBan), DINH_DANG.tien),
        ct("IFERROR(F" + r + "/C" + r + ",0)", chia(doanhThu, ngay), DINH_DANG.tien),
        oTien(thucThu)]);
    }
  }
  const c = hang.length, rTong = c + 1;
  if (c > 1) hang.push(["TỔNG", "",
    ct("SUM(C2:C" + c + ")", t.khaDung, DINH_DANG.so),
    ct("SUM(D2:D" + c + ")", t.demBan, DINH_DANG.so),
    ct("IFERROR(D" + rTong + "/C" + rTong + ",0)", chia(t.demBan, t.khaDung), DINH_DANG.phanTram),
    ct("SUM(F2:F" + c + ")", t.doanhThu, DINH_DANG.tien),
    ct("IFERROR(F" + rTong + "/D" + rTong + ",0)", chia(t.doanhThu, t.demBan), DINH_DANG.tien),
    ct("IFERROR(F" + rTong + "/C" + rTong + ",0)", chia(t.doanhThu, t.khaDung), DINH_DANG.tien),
    ct("SUM(I2:I" + c + ")", t.thucThu, DINH_DANG.tien)]);
  return { ten: "Theo tháng", cot: [11, 26, 13, 12, 14, 19, 14, 14, 15], hang };
}

function sheetTaiChinh(f) {
  const ds = bookingTrongLoc(f);
  const idB = new Set(ds.map((b) => b.id));
  const tt = payments.filter((x) => idB.has(x.booking_id));
  const homNay = vnToday();
  const hang = [];
  // Mỗi khối: tiêu đề · dòng cột · các dòng · dòng TỔNG bằng SUM thật (kèm giá trị sẵn)
  const khoi = (ten, cot, lamDong, tongCot) => {
    hang.push([ten]); hang.push(cot);
    const dau = hang.length + 1;
    const dong = lamDong(dau);
    dong.forEach((d) => hang.push(d));
    if (dong.length && tongCot) {
      const het = dau + dong.length - 1;
      hang.push(cot.map((_, i) => {
        if (!tongCot.includes(i)) return i === 0 ? "TỔNG" : "";
        const tong = dong.reduce((s, d) => s + (Number(d[i] && d[i].v) || 0), 0);
        return ct("SUM(" + cotChu(i) + dau + ":" + cotChu(i) + het + ")", tong, DINH_DANG.tien);
      }));
    }
    if (!dong.length) hang.push(["(không có dòng nào)"]);
    hang.push([]);
  };

  const trongKy = tt.filter((x) => x.due_date && x.due_date >= f.tu && x.due_date < f.den);
  const theoLoai = {};
  trongKy.forEach((x) => {
    const k = x.kind ?? "phi_khac";
    theoLoai[k] = theoLoai[k] ?? { due: 0, paid: 0 };
    theoLoai[k].due += x.amount_due ?? 0; theoLoai[k].paid += x.amount_paid ?? 0;
  });
  khoi("PHẢI THU THEO LOẠI", ["Loại", "Phải thu", "Đã thu", "Còn lại"], (dau) =>
    Object.entries(theoLoai).map(([k, v], i) => [LOAI_TIEN[k] ?? k, oTien(v.due), oTien(v.paid),
      ct("B" + (dau + i) + "-C" + (dau + i), v.due - v.paid, DINH_DANG.tien)]), [1, 2, 3]);

  const quaHan = tt.filter((x) => x.due_date && x.due_date < homNay && (x.amount_paid ?? 0) < (x.amount_due ?? 0))
    .sort((a, b) => a.due_date.localeCompare(b.due_date));
  khoi("QUÁ HẠN", ["Căn", "Khách", "Kỳ", "Hạn", "Số ngày trễ", "Còn thiếu"], (dau) =>
    quaHan.map((x, i) => {
      const b = ds.find((y) => y.id === x.booking_id);
      return [b ? tenCan(b.unit_id) : "—", b?.guest_name || "—",
        x.period_label || LOAI_TIEN[x.kind] || x.kind, oNgay(x.due_date),
        ct("TODAY()-D" + (dau + i), soNgay(x.due_date, homNay), DINH_DANG.so),
        oTien((x.amount_due ?? 0) - (x.amount_paid ?? 0))];
    }), [5]);

  const conThuDs = ds.map((b) => [b, ttCuaBooking(b)])
    .filter(([b, t]) => t.conPhaiThu > 0)
    .sort((a, c) => a[0].start_date.localeCompare(c[0].start_date));
  khoi("KHÁCH CÒN NỢ",
    ["Căn", "Khách", "Ngày nhận phòng", "Tổng phải thu", "Đã thu", "Còn phải thu", "Trạng thái lượt"], (dau) =>
    conThuDs.map(([b, t], i) => [tenCan(b.unit_id), b.guest_name || "—", oNgay(b.start_date),
      oTien(t.tongPhaiThu), oTien(t.daThu),
      ct("MAX(0,D" + (dau + i) + "-E" + (dau + i) + ")", t.conPhaiThu, DINH_DANG.tien),
      TRANG_THAI[b.status] ?? b.status]), [3, 4, 5]);

  const hoaHong = {};
  ds.forEach((b) => { if (b.commission_amount) {
    const k = b.broker_name || "(không ghi tên)";
    hoaHong[k] = (hoaHong[k] ?? 0) + b.commission_amount; } });
  khoi("HOA HỒNG MÔI GIỚI", ["Môi giới", "Hoa hồng"], () =>
    Object.entries(hoaHong).map(([k, v]) => [k, oTien(v)]), [1]);

  const theoKenh = {};
  ds.forEach((b) => {
    const k = b.channel ?? "khac";
    theoKenh[k] = theoKenh[k] ?? { tien: 0, luot: 0 };
    theoKenh[k].tien += b.rent_amount ?? 0; theoKenh[k].luot++;
  });
  khoi("DOANH THU THEO KÊNH", ["Kênh", "Số lượt", "Giá trị", "Cách thu tiền"], () =>
    Object.entries(theoKenh).map(([k, v]) => [KENH[k] ?? k, v.luot, oTien(v.tien),
      laOTA(k) ? "Nền tảng thu hộ, chuyển khoản trực tiếp"
               : "Khách trả trước, thu nốt khi nhận phòng"]), [2]);

  const idChac = new Set(ds.filter((b) => ["da_coc", "dang_o"].includes(b.status)).map((b) => b.id));
  khoi("DÒNG TIỀN 12 THÁNG TỚI", ["Tháng", "Phải thu"], () => {
    const r = [];
    for (let m = dauThang(homNay), i = 0; i < 12; m = themThang(m, 1), i++) {
      r.push([nhanThang(m), oTien(payments.filter((x) => idChac.has(x.booking_id)
        && x.due_date && x.due_date >= m && x.due_date < themThang(m, 1))
        .reduce((a, x) => a + (x.amount_due ?? 0), 0))]);
    }
    return r;
  }, [1]);

  return { ten: "Tài chính", cot: [26, 20, 16, 15, 15, 18, 40], hang };
}


function sheetLoiNhuan(f) {
  const o = gopTheoThang(f);
  const thangs = Object.keys(o).sort();
  const hang = [["Tháng", "Doanh thu phòng", "Hoa hồng", "Thu khác", "Chi phí", "Lợi nhuận"]];
  const T = { phong: 0, hoaHong: 0, thuKhac: 0, chi: 0 };
  thangs.forEach((m, i) => {
    const g = o[m], r = i + 2;
    T.phong += g.phong; T.hoaHong += g.hoaHong; T.thuKhac += g.thuKhac; T.chi += g.chi;
    hang.push([nhanThang(m), oTien(g.phong), oTien(g.hoaHong), oTien(g.thuKhac), oTien(g.chi),
      ct("B" + r + "-C" + r + "+D" + r + "-E" + r, loiNhuan(g), DINH_DANG.tien)]);
  });
  if (thangs.length) {
    const c = thangs.length + 1, r = c + 1;
    const sum = (col, v) => ct("SUM(" + col + "2:" + col + c + ")", v, DINH_DANG.tien);
    hang.push(["TỔNG", sum("B", T.phong), sum("C", T.hoaHong), sum("D", T.thuKhac), sum("E", T.chi),
      ct("B" + r + "-C" + r + "+D" + r + "-E" + r, T.phong - T.hoaHong + T.thuKhac - T.chi, DINH_DANG.tien)]);
  }

  // Ba bảng phụ: tháng làm cột
  const phu = (ten, khoa, nhan) => {
    const muc = [...new Set(thangs.flatMap((m) => Object.keys(o[m][khoa])))];
    if (!muc.length) return;
    hang.push([]); hang.push([ten]);
    hang.push(["", ...thangs.map((m) => nhanThang(m)), "Tổng"]);
    const dau = hang.length + 1;
    muc.forEach((k, i) => {
      const r = dau + i;
      const cuoiCot = String.fromCharCode(66 + thangs.length - 1);   // B..
      hang.push([nhan ? (nhan[k] ?? k) : k,
        ...thangs.map((m) => oTien(o[m][khoa][k] ?? 0)),
        ct("SUM(B" + r + ":" + cuoiCot + r + ")",
           thangs.reduce((x, m) => x + (o[m][khoa][k] ?? 0), 0), DINH_DANG.tien)]);
    });
  };
  phu("DOANH THU THEO KÊNH", "kenh", TEN_NHOM_KENH);
  phu("DOANH THU THEO CĂN", "can", null);
  phu("CHI PHÍ THEO PHÂN LOẠI", "loaiChi", Mo.PHAN_LOAI_CHI);

  return { ten: "Chi phí & lợi nhuận", cot: [22, 18, 15, 15, 15, 18, 15, 15], hang };
}

// ---------- 8.1 Báo cáo theo lượt khách ----------
function veLuot(f) {
  const ds = bookingTrongLoc(f).slice().sort((a, b) => a.start_date.localeCompare(b.start_date));
  const thuCuaBooking = (id) => payments.filter((t) => t.booking_id === id);
  const dichVuCuaBooking = (id) => thuKhac.filter((x) => x.booking_id === id);

  const T = { phaiThu: 0, daThu: 0, conThu: 0 };
  const hang = ds.map((b) => {
    const t = Mo.tinhThanhToan(b, thuCuaBooking(b.id), dichVuCuaBooking(b.id));
    T.phaiThu += t.tongPhaiThu; T.daThu += t.daThu; T.conThu += t.conPhaiThu;
    return { lop: t.conPhaiThu > 0 ? "tre" : "", o: [
      tenCan(b.unit_id),
      b.guest_name || "(chưa ghi tên)",
      ddmmyy(b.start_date), ddmmyy(b.end_date), soNgay(b.start_date, b.end_date),
      b.term_type === "dai_han" ? "Dài hạn" : "Ngắn hạn",
      KENH[b.channel] ?? "—",
      b.broker_name ?? "—",
      b.commission_amount ? tien(b.commission_amount) : "—",
      tien(b.rent_amount),
      t.tienDvu ? tien(t.tienDvu) : "—",
      tien(t.tongPhaiThu), tien(t.daThu), tien(t.conPhaiThu),
      Mo.nhanThanhToan(t).chu,
      TRANG_THAI[b.status] ?? b.status,
    ] };
  });
  if (ds.length) hang.push({ lop: "tong", o: ["TỔNG", "", "", "", "", "", "", "", "", "", "",
    tien(T.phaiThu), tien(T.daThu), tien(T.conThu), "", ""] });

  const tongDem = ds.reduce((s, b) => s + soNgay(b.start_date, b.end_date), 0);
  const coNgayTao = ds.filter((b) => b.created_at);
  const datTruoc = coNgayTao.length
    ? coNgayTao.reduce((s, b) => s + soNgay(b.created_at.slice(0, 10), b.start_date), 0) / coNgayTao.length : null;
  const theoKenh = {};
  ds.forEach((b) => (theoKenh[b.channel ?? "khac"] = (theoKenh[b.channel ?? "khac"] ?? 0) + 1));

  $("#than").innerHTML = `
    <div class="the-luoi">
      <div class="the"><span class="so">${ds.length}</span><span class="nhan">lượt thuê</span></div>
      <div class="the"><span class="so">${tongDem}</span><span class="nhan">tổng số đêm</span></div>
      <div class="the"><span class="so">${ds.length ? Math.round(tongDem / ds.length) : 0}</span><span class="nhan">độ dài lưu trú trung bình (đêm)</span></div>
      <div class="the"><span class="so">${datTruoc === null ? "—" : Math.round(datTruoc)}</span><span class="nhan">đặt trước trung bình (ngày)</span></div>
      <div class="the ${T.conThu ? "nhac" : ""}"><span class="so">${tien(T.conThu)}</span><span class="nhan">còn phải thu của khách</span></div>
      <div class="the"><span class="so">${tien(T.daThu)}</span><span class="nhan">đã thu</span></div>
    </div>
    <p class="muted">Tỷ trọng theo kênh: ${Object.entries(theoKenh).map(([k, v]) =>
      `${KENH[k] ?? k} ${phanTram(v / (ds.length || 1))}`).join(" · ") || "—"}
      ${datTruoc === null ? "<br>Thời gian đặt trước cần cột ngày tạo booking — tài khoản chỉ xem không đọc được cột này." : ""}</p>
    <h2>Từng lượt thuê</h2>
    ${ds.length ? bang(["Căn", "Khách", "Ngày vào", "Ngày trả", "Số đêm", "Kiểu thuê", "Kênh", "Môi giới",
        "Hoa hồng", "Tiền phòng", "Dịch vụ thêm", "Tổng phải thu", "Đã thu", "Còn phải thu",
        "Tình trạng thanh toán", "Trạng thái"], hang, { so: [4, 8, 9, 10, 11, 12, 13] })
      : `<p class="trong">Không có lượt thuê nào trong khoảng lọc.</p>`}
    <p class="muted">Khoản khách trả trước ghi ở form booking được tính vào cột "Đã thu".
      Các khoản thu có ngày ghi ở nút <b>Thanh toán</b> của từng lượt.</p>`;
}

// ---------- 8.2 Báo cáo theo tháng ----------
// Doanh thu ghi nhận phân bổ đều theo ngày: dài hạn lấy giá tháng chia số ngày của tháng;
// ngắn hạn lấy tổng tiền chia tổng số đêm, rồi nhân số đêm rơi vào tháng đó.
function veThang(f) {
  const can = canTrongLoc(f), ds = bookingTrongLoc(f);
  const thangs = [];
  for (let m = dauThang(f.tu); m < f.den; m = themThang(m, 1)) thangs.push(m);

  const o = [];
  for (const u of can) {
    for (const m of thangs) {
      const mEnd = themThang(m, 1), ngay = ngayTrongThang(m);
      let demBan = 0, doanhThu = 0;
      for (const b of ds.filter((x) => x.unit_id === u.id)) {
        const d = giaoDem(b.start_date, b.end_date, m, mEnd);
        if (!d) continue;
        demBan += d;
        const tongDem = soNgay(b.start_date, b.end_date);
        const moiDem = b.term_type === "dai_han"
          ? (b.rent_amount ?? 0) / ngay
          : (b.rent_amount ?? 0) / (tongDem || 1);
        doanhThu += moiDem * d;
      }
      const idB = new Set(ds.filter((x) => x.unit_id === u.id).map((x) => x.id));
      const thucThu = payments.filter((t) => idB.has(t.booking_id) && t.paid_date
        && t.paid_date >= m && t.paid_date < mEnd).reduce((s, t) => s + (t.amount_paid ?? 0), 0);
      o.push({ unit: u, thang: m, khaDung: ngay, demBan, doanhThu, thucThu });
    }
  }

  const gop = $("#fGop")?.value ?? "can";
  const khoa = (r) => gop === "can" ? r.unit.id + r.thang : gop === "nha" ? r.unit.property_id + r.thang : r.thang;
  const nhomLai = {};
  o.forEach((r) => {
    const k = khoa(r);
    if (!nhomLai[k]) nhomLai[k] = { ten: gop === "can" ? Mo.tenCan(r.unit, D.props)
        : gop === "nha" ? (D.props.find((p) => p.id === r.unit.property_id)?.name ?? "—") : "Toàn hệ thống",
      thang: r.thang, khaDung: 0, demBan: 0, doanhThu: 0, thucThu: 0 };
    const g = nhomLai[k];
    g.khaDung += r.khaDung; g.demBan += r.demBan; g.doanhThu += r.doanhThu; g.thucThu += r.thucThu;
  });
  const dong = Object.values(nhomLai).sort((a, b) => a.thang.localeCompare(b.thang) || a.ten.localeCompare(b.ten));

  const hang = dong.map((g) => ({ o: [
    nhanThang(g.thang), g.ten, g.khaDung, g.demBan, phanTram(g.khaDung ? g.demBan / g.khaDung : null),
    tien(g.doanhThu), tien(g.demBan ? g.doanhThu / g.demBan : null), tien(g.khaDung ? g.doanhThu / g.khaDung : null),
    tien(g.thucThu),
  ] }));
  const t = dong.reduce((s, g) => ({ khaDung: s.khaDung + g.khaDung, demBan: s.demBan + g.demBan,
    doanhThu: s.doanhThu + g.doanhThu, thucThu: s.thucThu + g.thucThu }), { khaDung: 0, demBan: 0, doanhThu: 0, thucThu: 0 });
  if (dong.length) hang.push({ lop: "tong", o: ["Tổng", "", t.khaDung, t.demBan,
    phanTram(t.khaDung ? t.demBan / t.khaDung : null), tien(t.doanhThu),
    tien(t.demBan ? t.doanhThu / t.demBan : null), tien(t.khaDung ? t.doanhThu / t.khaDung : null), tien(t.thucThu)] });

  $("#than").innerHTML = `
    <div class="cong-cu">
      <label for="fGop" style="margin:0 6px 0 0">Gộp theo</label>
      <select id="fGop" style="flex:0 0 160px">
        <option value="can">Từng căn</option><option value="nha">Từng nhà</option><option value="tong">Toàn hệ thống</option>
      </select>
    </div>
    <div class="the-luoi">
      <div class="the"><span class="so">${phanTram(t.khaDung ? t.demBan / t.khaDung : null)}</span><span class="nhan">tỷ lệ lấp đầy</span></div>
      <div class="the"><span class="so">${t.demBan}</span><span class="nhan">đêm đã bán / ${t.khaDung} đêm khả dụng</span></div>
      <div class="the"><span class="so">${tien(t.doanhThu)}</span><span class="nhan">doanh thu ghi nhận</span></div>
      <div class="the"><span class="so">${tien(t.thucThu)}</span><span class="nhan">thực thu trong kỳ</span></div>
    </div>
    <h2>Chi tiết theo tháng</h2>
    ${hang.length ? bang(["Tháng", gop === "can" ? "Căn" : gop === "nha" ? "Nhà" : "", "Đêm khả dụng", "Đêm đã bán",
        "Tỷ lệ lấp đầy", "Doanh thu ghi nhận", "ADR", "RevPAR", "Thực thu"], hang, { so: [2, 3, 4, 5, 6, 7, 8] })
      : `<p class="trong">Không có số liệu trong khoảng lọc.</p>`}
    <p class="muted">ADR = doanh thu ghi nhận ÷ đêm đã bán. RevPAR = doanh thu ghi nhận ÷ đêm khả dụng.
      Chưa có so sánh cùng kỳ năm trước vì hệ thống chưa đủ một năm dữ liệu.</p>`;
  $("#fGop").value = gop;
  $("#fGop").onchange = ve;
}

// ---------- 8.3 Báo cáo tài chính ----------
function veTaiChinh(f) {
  const ds = bookingTrongLoc(f);
  const idB = new Set(ds.map((b) => b.id));
  const tt = payments.filter((t) => idB.has(t.booking_id));
  const homNay = vnToday();
  const trongKy = tt.filter((t) => t.due_date && t.due_date >= f.tu && t.due_date < f.den);

  const theoLoai = {};
  trongKy.forEach((t) => {
    const k = t.kind ?? "phi_khac";
    theoLoai[k] = theoLoai[k] ?? { due: 0, paid: 0 };
    theoLoai[k].due += t.amount_due ?? 0; theoLoai[k].paid += t.amount_paid ?? 0;
  });

  const quaHan = tt.filter((t) => t.due_date && t.due_date < homNay && (t.amount_paid ?? 0) < (t.amount_due ?? 0));
  const sapToi = tt.filter((t) => t.due_date && t.due_date >= homNay && t.due_date <= themNgay(homNay, 7)
    && (t.amount_paid ?? 0) < (t.amount_due ?? 0));
  // Khách còn nợ: tính theo đúng công thức của màn hình chi tiết, gồm cả dịch vụ
  // thêm và các khoản đã thu có ngày. Kênh OTA coi như nền tảng đã thu đủ.
  const conNoDs = ds.map((b) => [b, ttCuaBooking(b)]).filter(([, t]) => t.conPhaiThu > 0);
  const tongConThu = conNoDs.reduce((s, [, t]) => s + t.conPhaiThu, 0);
  const daTraTruoc = ds.reduce((s, b) => s + ttCuaBooking(b).daThu, 0);

  const hoaHong = {};
  ds.forEach((b) => {
    if (!b.commission_amount) return;
    const k = b.broker_name || "(không ghi tên)";
    hoaHong[k] = (hoaHong[k] ?? 0) + b.commission_amount;
  });

  const theoKenh = {};
  ds.forEach((b) => {
    const k = b.channel ?? "khac";
    theoKenh[k] = (theoKenh[k] ?? 0) + (b.rent_amount ?? 0);
  });

  // Dòng tiền 12 tháng tới: các kỳ phải thu của booking đã cọc / đang ở
  const idChac = new Set(ds.filter((b) => ["da_coc", "dang_o"].includes(b.status)).map((b) => b.id));
  const dongTien = [];
  for (let m = dauThang(homNay), i = 0; i < 12; m = themThang(m, 1), i++) {
    const mEnd = themThang(m, 1);
    const s = payments.filter((t) => idChac.has(t.booking_id) && t.due_date && t.due_date >= m && t.due_date < mEnd)
      .reduce((x, t) => x + (t.amount_due ?? 0), 0);
    dongTien.push({ thang: m, so: s });
  }

  const tongDue = trongKy.reduce((s, t) => s + (t.amount_due ?? 0), 0);
  const tongPaid = trongKy.reduce((s, t) => s + (t.amount_paid ?? 0), 0);
  const tongQuaHan = quaHan.reduce((s, t) => s + ((t.amount_due ?? 0) - (t.amount_paid ?? 0)), 0);

  const hangQuaHan = quaHan.sort((a, b) => a.due_date.localeCompare(b.due_date)).map((t) => {
    const b = ds.find((x) => x.id === t.booking_id);
    return { lop: "tre", o: [b ? tenCan(b.unit_id) : "—", b?.guest_name || "—",
      t.period_label || LOAI_TIEN[t.kind] || t.kind, ddmmyy(t.due_date),
      soNgay(t.due_date, homNay) + " ngày", tien((t.amount_due ?? 0) - (t.amount_paid ?? 0))] };
  });

  const khoiQuaHan = hangQuaHan.length
    ? bang(["Căn", "Khách", "Kỳ", "Hạn", "Trễ", "Còn thiếu"], hangQuaHan, { so: [5] })
    : `<p class="muted">Không có khoản thu nào quá hạn.</p>`;

  const hangSapToi = sapToi.sort((a, b) => a.due_date.localeCompare(b.due_date)).map((t) => {
    const b = ds.find((x) => x.id === t.booking_id);
    return { o: [b ? tenCan(b.unit_id) : "—", b?.guest_name || "—",
      t.period_label || LOAI_TIEN[t.kind] || t.kind, ddmmyy(t.due_date),
      tien((t.amount_due ?? 0) - (t.amount_paid ?? 0))] };
  });
  const khoiSapToi = hangSapToi.length
    ? bang(["Căn", "Khách", "Kỳ", "Hạn", "Còn thiếu"], hangSapToi, { so: [4] })
    : `<p class="muted">Không có khoản nào tới hạn trong 7 ngày tới.</p>`;

  const hangCoc = conNoDs.sort((a, b) => a[0].start_date.localeCompare(b[0].start_date))
    .map(([b, t]) => ({ lop: b.status === "ket_thuc" ? "tre" : "",
      o: [tenCan(b.unit_id), b.guest_name || "—", ddmmyy(b.start_date),
          tien(t.tongPhaiThu), tien(t.daThu), tien(t.conPhaiThu),
          TRANG_THAI[b.status] ?? b.status] }));
  const khoiCoc = hangCoc.length
    ? bang(["Căn", "Khách", "Ngày nhận phòng", "Tổng phải thu", "Đã thu", "Còn phải thu", "Trạng thái lượt"],
           hangCoc, { so: [3, 4, 5] })
    : `<p class="muted">Không có khách nào còn nợ.</p>`;

  $("#than").innerHTML = `
    <div class="the-luoi">
      <div class="the"><span class="so">${tien(tongDue)}</span><span class="nhan">phải thu trong kỳ</span></div>
      <div class="the"><span class="so">${tien(tongPaid)}</span><span class="nhan">đã thu</span></div>
      <div class="the ${tongQuaHan ? "nhac" : ""}"><span class="so">${tien(tongQuaHan)}</span><span class="nhan">quá hạn (${quaHan.length} khoản)</span></div>
      <div class="the ${tongConThu ? "nhac" : ""}"><span class="so">${tien(tongConThu)}</span><span class="nhan">khách còn nợ (${conNoDs.length} lượt)</span></div>
    </div>

    <h2>Phải thu theo loại</h2>
    <div class="bang-khung"><table class="bang"><thead><tr><th>Loại</th><th class="so">Phải thu</th><th class="so">Đã thu</th><th class="so">Còn lại</th></tr></thead>
      <tbody>${Object.entries(theoLoai).map(([k, v]) => `<tr><td>${LOAI_TIEN[k] ?? k}</td>
        <td class="so">${tien(v.due)}</td><td class="so">${tien(v.paid)}</td><td class="so">${tien(v.due - v.paid)}</td></tr>`).join("")
        || `<tr><td colspan="4" class="muted">Chưa có kỳ thu nào trong khoảng lọc.</td></tr>`}</tbody></table></div>

    <h2>Quá hạn</h2>${khoiQuaHan}
    <h2>Sắp tới hạn (7 ngày)</h2>${khoiSapToi}
    <h2>Khách còn nợ</h2>
    <p class="muted">Tổng đã thu trong khoảng lọc: <b>${tien(daTraTruoc)}</b> — gồm khoản khách
      trả trước và các khoản thu ghi ở nút Thanh toán của từng lượt.
      Lượt qua Airbnb, Booking.com, Agoda không nằm ở đây vì nền tảng thu hộ.
      Dòng tô đỏ là lượt đã đóng nhưng vẫn còn nợ — cần kiểm tra lại.</p>
    ${khoiCoc}

    <h2>Hoa hồng môi giới</h2>
    ${Object.keys(hoaHong).length
      ? `<div class="bang-khung"><table class="bang"><thead><tr><th>Môi giới</th><th class="so">Hoa hồng</th></tr></thead><tbody>${
        Object.entries(hoaHong).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="so">${tien(v)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="muted">Chưa ghi nhận hoa hồng môi giới trong khoảng lọc${me.canBook ? "" : " (tài khoản chỉ xem không đọc được cột này)"}.</p>`}

    <h2>Doanh thu theo kênh</h2>
    <div class="bang-khung"><table class="bang"><thead><tr><th>Kênh</th><th class="so">Giá trị hợp đồng</th></tr></thead>
      <tbody>${Object.entries(theoKenh).map(([k, v]) => `<tr><td>${KENH[k] ?? k}</td><td class="so">${tien(v)}</td></tr>`).join("")
        || `<tr><td colspan="2" class="muted">Chưa có dữ liệu.</td></tr>`}</tbody></table></div>

    <h2>Dòng tiền 12 tháng tới</h2>
    <p class="muted">Tổng tiền phải thu theo tháng của các lượt đã cọc và đang ở — để biết trước tháng nào hụt.</p>
    <div class="bang-khung"><table class="bang"><thead><tr><th>Tháng</th><th class="so">Phải thu</th></tr></thead>
      <tbody>${dongTien.map((r) => `<tr><td>${nhanThang(r.thang)}</td><td class="so">${r.so ? tien(r.so) : "—"}</td></tr>`).join("")}</tbody></table></div>`;

}
</script>
